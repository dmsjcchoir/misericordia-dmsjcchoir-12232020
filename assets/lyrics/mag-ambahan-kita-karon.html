<p class="composer" style="font-size: 0.85rem;">
    <i>
        Rudy Villanueva
    </i>
</p>

<div class="stanza">
    <p>
        <b>1. </b> Mag-ambahan kita karon mga anak sa Dios. <br>
        Nabulahan kitang tanan sa Iyang bendesiyon.
    </p>
    
    <p>
        <strong>Koro:</strong> <br>
        Atong daygon ang Amahan, ang Anak, ug Espiritu Santo, <br>
	    Karon ug sa gihapon atong pagsimbahon.
    </p>

    <p>
        <b>2. </b> Ang maayong balita sa’tong kaluwasan <br>
        Ipahayag ta karon ngadto sa katawhan. <br>
        <em style="font-size: 0.85rem;">Ulitin ang Koro</em>
    </p>
</div>
