<div class="stanza">
    <p>
        <b>1. </b> Wa'y sama ang gugma sa Dios alang kanimo <br>
        Kinabuhi giula aron ka maluwas
    </p>

    <p>
        <b>1. </b> Kalapasan, kadautan sa tawo gipapas <br>
        Pasaylo ug gugma gihatag sa Dios
    </p>
    
    <p>
        <strong>Koro:</strong> <br>
        Duol kaniya kay mamati Siya <br>
        Ug salig sa iyang gugma <br>
        Kinabuhi tanawa ang Dios pamatia <br>
        Kanunay maghari Siya
    </p>
</div>
