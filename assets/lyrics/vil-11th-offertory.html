<div class="stanza">
    <p>
        Ning adlaw sa Pasko nga miabut, <br>
        May d’yuta’y kong gasa kanimo bisan di takus, <br>
        Wala koy bulawan, sarang ikagasa <br>
        Ug wa koy pulong nga wa malitok sa uban. <br>
        Kining akong awit, kabus nakong awit <br>
        Hinatag sa langit, ug imo karon. <br>
    </p>
