    <i>
        Rudy Villanueva
    </i>
</p>

<div class="stanza">
    <p>
        <b>1. </b> Unsay igasa ko Kanimo tungod sa Imong kaayo?
    </p>
    
    <p>
        <strong>Koro:</strong> <br>
        Giluwas Mo ako gikan sa sala <br>
        Ug kanunay Imong gipakita sa kaayo nga way sukod.
    </p>

    <p>
        <b>2. </b> Unsaon ko karon pagbalus Kanimo niining tanan? <br>
        <em style="font-size: 0.85rem;">Ulitin ang Koro</em>
    </p>

    <p>
        <strong>Koda:</strong> <br>
        Sa kaayo nga way sukod.
    </p>
</div>
