<div class="stanza">
    <p>
        <b>1. </b> Umanhi Ka, Mesiyas, kami Kanimo naghandum <br>
        Ikaw man ang paglaum kanamo magluwas.
    </p>
    
    <p>
        <strong>Koro:</strong> <br>
        Manunubos, umanhi Ka, <br>
        Ang kangitngitan sa yuta <br>
        Hayagi sa Imong grasya.
    </p>

    <p>
        <b>2. </b> Kanunay ka gihidlaw sa nasud ug manalagna <br>
        O malipayong adlaw, O langitnong suga
        <em style="font-size: 0.85rem;">Ulitin ang Koro</em>
    </p>
</div>
