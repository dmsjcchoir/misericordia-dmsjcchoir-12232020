    <i>
        Rudy Villanueva
    </i>
</p>

<div class="stanza">
    <p>
        Ang mahal mo nga panalangin amo na karon. <br>
        Nahiusa kining lungsod sa paghalad ug pagdawat <br>
        Sa bililhon mong lawas ug dugo. <br>
        Pun-a kami, O Ginoo sa kadait ug gugma mo. <br>
        Ang tanan karon himoa nga magsaksi ug magsangyaw sa mensahe sa kaluwasan. <br>
        Amen, amen.
    </p>
</div>
