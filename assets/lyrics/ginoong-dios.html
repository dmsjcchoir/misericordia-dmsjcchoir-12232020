<p class="composer" style="font-size: 0.85rem;">
    <i>
        Rudy Villanueva
    </i>
</p>

<div class="stanza">
    <p>
        <b>1. </b> Ginoong Dios kaloy-a na ang Imong lungsod <br>
        Tungod sa Imong gugma nga walay sukod.
    </p>

    <p>
        <b>2. </b> Ang mga utang ug ang among kalapasan <br>
        Intawn’n papasa ug ayaw hinumdomi.
    </p>

    <p>
        <b>3. </b> Sa ngalan ni Hesus ang Manluluwas <br>
        Gisangpit Ka karon nga among Amahan.
    </p>
</div>
