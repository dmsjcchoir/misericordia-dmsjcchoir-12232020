<p class="composer" style="font-size: 0.85rem;">
    <i>
        Rudy Villanueva
    </i>
</p>

<div class="stanza">
    <p>
       <strong>Koro:</strong> <br>
        Pahulay nga dayon ihatag nimo Kaniya O Ginoo <br>
        Ug ang kahayag nga way pagkapalong <br>
        Magdan-ag kaniya
    </p>

    <p>
        Angay alang Kanimo ang himno O Dios didto sa Sion <br>
        Ang katahuman sa pana-ad Kanimo didto sa Jerusalem <br>
        Pamatia ang among pag-ampo, <br>
        Kanimo ang tanang tawo mudangop. <br>
        <em style="font-size: 0.85rem;">Ulitin ang Koro</em>
    </p>
</div>
